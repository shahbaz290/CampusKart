<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="home.style.css">
    <link rel="stylesheet" href="login.style.css">
</head>

<body>
    <header>
        <nav>
            <a href="index.html">
                <img src="images/logo.png" alt="CampusKart Logo">
            </a>
            <div>
                <input class="Search" type="text" placeholder="Search">
            </div>
            <div class="navvv">
                <a href="index.html">Home</a>
                <a href="sell.html">Sell/Donate</a>
                <a href="my-listings.html">My Listings</a>
                <a href="about.html">About</a>
                <a href="login.html">Login</a>
            </div>
        </nav>
    </header>
    <section>

        <section>
            <div class="login">

                <h2>Welcome Back!</h2>
                <p>Login to your CampusKart account</p>

                <form action="" id="login-form">

                    <label for="email">Enter email or mobile number:</label>
                    <input class="input-box" type="text" id="email" placeholder="Email or Mobile" required>

                    <label for="pass">Enter Password:</label>
                    <input class="input-box" type="password" id="pass" placeholder="Password" required>

                    <button type="submit">Login</button>

                </form>

                <p class="register-link">
                    New to CampusKart?
                    <a href="register.html">Register here</a>
                </p>

            </div>
        </section>

    </section>
    <script src="config.js"></script>
    <script src="login.js"></script>
    <script src="auth.js"></script>
</body>

</html>
